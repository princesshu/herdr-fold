# For the maintainer: every Monday, whether what herdr-fold builds on has moved on (tools/check_updates.py). A run that
# fails is mailed by GitHub to whoever last changed this schedule; it opens no issue, writes no commit and changes
# nothing in the repository.
name: Check for updates

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_updates.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
