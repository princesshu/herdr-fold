# starship: the ❯ alone (the branch the space's row's, the git state the sidebar's Changes); a folder line above only
# where it tells something: in a repository the path inside it, outside one the path. The colors are the chosen
# theme's: ~/.config/herdr-fold/themes/apply.py rewrites them (Cmd+K, Cmd+T).
format = "$directory$character"

[directory]
style = "bold #cba6f7"
repo_root_style = "bold #cba6f7"
before_repo_root_style = "bold #cba6f7"
truncate_to_repo = true
truncation_length = 4
format = "[$path]($style)[$read_only]($read_only_style)\n"
repo_root_format = "([$path]($style)[$read_only]($read_only_style)\n)"

[character]
success_symbol = "[❯](bold #cba6f7)"
error_symbol = "[❯](bold #f38ba8)"
