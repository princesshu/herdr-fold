id = "herdr-fold.sessions-view"
name = "AI Sessions"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = """\
  herdr's Agents panel as AI sessions: the current workspace's Claude and Codex conversations with their state, \
  each under the conversation's name or your pane name, the same name on its own tab; and for each workspace, how \
  long an agent there has waited on you. Created by princesshu"""
platforms = ["macos", "linux", "windows"]

# After every server start: marks + view (neither survives a restart on its own).
[[startup]]
command = ["/usr/bin/python3", "sessions.py"]
platforms = ["macos", "linux"]

# New agent in the pane (e.g. a conversation resumed on reopen).
[[events]]
on = "pane.agent_detected"
command = ["/usr/bin/python3", "sessions.py"]
platforms = ["macos", "linux"]

# Once an agent starts working, it definitely has a conversation; blocked or done, it waits on you (since now).
# (Title changes — pane.updated — are not available as a plugin event.)
[[events]]
on = "pane.agent_status_changed"
command = ["/usr/bin/python3", "sessions.py"]
platforms = ["macos", "linux"]

# On focus changes too: this way Claude's/Codex's own /rename quickly shows up in AI Sessions (name tracking).
[[events]]
on = "pane.focused"
command = ["/usr/bin/python3", "sessions.py"]
platforms = ["macos", "linux"]

[[events]]
on = "tab.focused"
command = ["/usr/bin/python3", "sessions.py"]
platforms = ["macos", "linux"]

# Manual reapply: herdr plugin action invoke herdr-fold.sessions-view.apply
[[actions]]
id = "apply"
title = "AI Sessions: reapply"
command = ["/usr/bin/python3", "sessions.py"]
platforms = ["macos", "linux"]

# Mark unread (Cmd+Shift+U): the focused agent waits on you again, its workspace says so, until you come back to it
[[actions]]
id = "mark-unread"
title = "AI Sessions: mark unread"
command = ["/usr/bin/python3", "sessions.py", "--unread"]
platforms = ["macos", "linux"]

# Windows: the same. Machine setup (prepare-windows.ps1) replaces "python" with the full path to Python.
[[startup]]
command = ["python", "sessions.py"]
platforms = ["windows"]

[[events]]
on = "pane.agent_detected"
command = ["python", "sessions.py"]
platforms = ["windows"]

[[events]]
on = "pane.agent_status_changed"
command = ["python", "sessions.py"]
platforms = ["windows"]

[[events]]
on = "pane.focused"
command = ["python", "sessions.py"]
platforms = ["windows"]

[[events]]
on = "tab.focused"
command = ["python", "sessions.py"]
platforms = ["windows"]

# Manual reapply on Windows: herdr plugin action invoke apply-windows --plugin herdr-fold.sessions-view (an action id is
# unique within a plugin, so the Windows one has its own)
[[actions]]
id = "apply-windows"
title = "AI Sessions: reapply"
command = ["python", "sessions.py"]
platforms = ["windows"]

[[actions]]
id = "mark-unread-windows"
title = "AI Sessions: mark unread"
command = ["python", "sessions.py", "--unread"]
platforms = ["windows"]
