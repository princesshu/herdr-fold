id = "herdr-fold.sidebar"
name = "Sidebar"
version = "0.3.0"
min_herdr_version = "0.9.5"
description = """\
  Every workspace's Claude and Codex conversations, Files, Search, Changes (git) and GitHub Issues in one pane, one \
  at a time under a row of tabs, each shown or hidden from its menu, with previews in a tab and AI commit messages. \
  A new tab gets it on the right, above a terminal, and it comes back when herdr starts. Created by princesshu"""
platforms = ["macos", "linux", "windows"]

# A pane of the plugin's closed by hand: the first time on this Mac, herdr says once how it comes back (Cmd+Shift+O)
[[events]]
on = "pane.closed"
command = ["/usr/bin/python3", "panes.py", "--closed"]
platforms = ["macos"]

# New tab (a new workspace's first tab too): one still an unnamed pane running a shell gets the right column, never
# the "new" button's workspace while Workspaces' folder picker is open in it (see panes.py)
[[events]]
on = "tab.created"
platforms = ["macos", "linux"]
command = ["/usr/bin/python3", "panes.py", "--new-tab"]

# The same on Windows with Python (prepare-windows.ps1 fills in the full path of the machine's Python)
[[events]]
on = "tab.created"
platforms = ["windows"]
command = ["python", "panes.py", "--new-tab"]

# herdr's start (after the session is restored): each tab's right column back but for a pane closed by hand, herdr's
# first shell's, an empty sidebar shell running the sidebar again (herdr-fold's Workspaces starts the agents)
[[startup]]
platforms = ["macos", "linux"]
command = ["/usr/bin/python3", "panes.py", "--startup"]

[[startup]]
platforms = ["windows"]
command = ["python", "panes.py", "--startup"]

# The sidebar itself runs in a plain pane named "sidebar" (python3 sidebar.py [FOLDER]); these actions show a panel
# in the active tab's sidebar by sending it F9, F10, F11 or F12.
[[actions]]
id = "show-files"
title = "Sidebar: Files"
command = ["/usr/bin/python3", "actions.py", "show-files"]
platforms = ["macos", "linux"]

[[actions]]
id = "show-search"
title = "Sidebar: Search"
command = ["/usr/bin/python3", "actions.py", "show-search"]
platforms = ["macos", "linux"]

[[actions]]
id = "show-git"
title = "Sidebar: Changes"
command = ["/usr/bin/python3", "actions.py", "show-git"]
platforms = ["macos", "linux"]

[[actions]]
id = "show-issues"
title = "Sidebar: Issues"
command = ["/usr/bin/python3", "actions.py", "show-issues"]
platforms = ["macos", "linux"]

# Cmd + A: the text of the field that has the keys, in the sidebar that has them (F8); other panes are left alone
[[actions]]
id = "select-all"
title = "Sidebar: select the field's text"
command = ["/usr/bin/python3", "actions.py", "select-all"]
platforms = ["macos", "linux"]

# Windows: the same with Python (an action id is unique within a plugin, so the Windows ones have their own)
[[actions]]
id = "show-files-windows"
title = "Sidebar: Files"
command = ["python", "actions.py", "show-files"]
platforms = ["windows"]

[[actions]]
id = "show-search-windows"
title = "Sidebar: Search"
command = ["python", "actions.py", "show-search"]
platforms = ["windows"]

[[actions]]
id = "show-git-windows"
title = "Sidebar: Changes"
command = ["python", "actions.py", "show-git"]
platforms = ["windows"]

[[actions]]
id = "show-issues-windows"
title = "Sidebar: Issues"
command = ["python", "actions.py", "show-issues"]
platforms = ["windows"]

[[actions]]
id = "select-all-windows"
title = "Sidebar: select the field's text"
command = ["python", "actions.py", "select-all"]
platforms = ["windows"]

# The sidebar's Conversations found: Chats shown, its filter empty and the keys going to it (F7)
[[actions]]
id = "find-conversation"
title = "Conversations: find"
command = ["/usr/bin/python3", "actions.py", "find-conversation"]
platforms = ["macos", "linux"]

[[actions]]
id = "find-conversation-windows"
title = "Conversations: find"
command = ["python", "actions.py", "find-conversation"]
platforms = ["windows"]

# Restore panels: every pane of the plugin's the tab lacks back (in a tab without any, the sidebar above a terminal
# beside the agent), and the right column shown; installed on its own, this opens the sidebar
[[actions]]
id = "restore-panels"
title = "Sidebar: restore panels"
command = ["/usr/bin/python3", "panes.py", "--restore"]
platforms = ["macos", "linux"]

[[actions]]
id = "restore-panels-windows"
title = "Sidebar: restore panels"
command = ["python", "panes.py", "--restore"]
platforms = ["windows"]
