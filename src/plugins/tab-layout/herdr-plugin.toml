id = "herdr-fold.tab-layout"
name = "Tab Layout"
version = "0.3.0"
min_herdr_version = "0.9.5"
description = """\
  Keeps the layout: a new workspace asks for its folder, new tabs get the columns, and after a restart the \
  Conversations columns, sidebars and agents come back. \
  Part of herdr-fold: install it with herdr-fold's installer. Created by princesshu"""
platforms = ["macos", "linux", "windows"]

# New tab (including a new workspace's first tab) — for the "new" button's workspace it opens the folder picker,
# otherwise it only rearranges an empty, unnamed shell tab (see tab_layout.py).
[[events]]
on = "tab.created"
platforms = ["macos", "linux"]
command = ["/usr/bin/python3", "tab_layout.py"]

# The same on Windows with Python (prepare-windows.ps1 fills in the full path of the machine's Python); there is no
# folder picker there, so a new workspace gets the columns too
[[events]]
on = "tab.created"
platforms = ["windows"]
command = ["python", "tab_layout.py"]

# A pane's focus: a workspace named after its folder takes the folder's new name (Windows does not let a folder in use
# be renamed)
[[events]]
on = "pane.focused"
platforms = ["macos", "linux"]
command = ["/usr/bin/python3", "tab_layout.py"]

# herdr startup (after the session is restored): the Conversations, sidebar and agent panes only have an empty shell —
# restore_panes.py restarts them (it leaves conversations resumed by herdr alone).
[[startup]]
platforms = ["macos", "linux"]
command = ["/bin/sh", "-c", "exec /usr/bin/python3 \"$HOME/.config/herdr-fold/restore_panes.py\" --startup"]

[[startup]]
platforms = ["windows"]
command = ["python", "..\\..\\restore_panes.py", "--startup"]

# The folder picker (new_workspace.py) — tab_layout.py opens it in the "new" button's workspace.
[[panes]]
id = "new-workspace"
platforms = ["macos", "linux"]
title = "New workspace"
placement = "popup"
width = "70%"
height = "70%"
command = ["/bin/sh", "-c", "exec /usr/bin/python3 \"$HOME/.config/herdr-fold/new_workspace.py\""]

# Close-tab confirmation (close_tab.py --confirm) — close_tab.py (Cmd+W) opens it if the tab has a conversation.
[[panes]]
id = "close-confirm"
platforms = ["macos", "linux"]
title = "Close tab"
placement = "popup"
width = "60%"
height = 11
command = ["/bin/sh", "-c", "exec /usr/bin/python3 \"$HOME/.config/herdr-fold/close_tab.py\" --confirm"]
